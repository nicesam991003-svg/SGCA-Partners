<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 - 리포트 등록 | SGCA Partners</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="shortcut icon" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/favicon.png">
        <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="css/style.css?v=1.1">
    <link rel="stylesheet" href="css/admin.css?v=1.1">
    <!-- Quill WYSIWYG Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

    <!-- SEO & Localization -->
    <link rel="canonical" href="https://sgca-partners.com/admin.html">
    
</head>
<body style="background-color: #f4f6f9;">
    <!-- Admin Navbar -->
    <header class="navbar" style="position: static;">
        <div class="container" style="min-height: 80px; justify-content: space-between;">
            <a href="index.html" class="logo">
                <img src="images/logo.svg" alt="SGCA Partners" height="50">
            </a>
            <div style="display:flex; align-items:center; gap: 20px;">
                <a href="insights.html" style="font-weight:600; color:var(--color-slate-grey); text-decoration:underline;">인사이트 화면 보기</a>
                <div style="font-weight: 700; font-size: 1.2rem; color: var(--color-accent); background: rgba(211,164,92,0.1); padding: 5px 15px; border-radius: 20px;">관리자 모드</div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="admin-container">
            <div class="admin-header">
                <h2>인사이트 리포트 등록</h2>
                <p>기존 리포트와 자동 생성 초안을 불러와 수정할 수 있습니다. 원문과 번역을 확인한 뒤 게시합니다.</p>
            </div>

            <div id="administrator-auth-panel" style="padding:16px;background:#edf1f7;margin-bottom:16px;"><p data-auth-status role="status"></p><button type="button" data-auth-login class="btn-edit">관리자 로그인</button><button type="button" data-auth-logout class="btn-edit" hidden>로그아웃</button></div>
            <p id="editor-load-status" role="status" style="margin:16px 0;"></p>
            <button type="button" id="start-new-report" class="btn-edit">새 리포트 직접 작성</button>
            <form id="admin-form">
                <div class="form-group">
                    <label>리포트 제목</label>
                    <input type="text" id="post-title" required placeholder="예: FDA 의료기기 사이버보안 최신 가이드라인 발표">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>카테고리</label>
                        <select id="post-category" required style="width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 4px; font-family: inherit; font-size: 1rem;">
                            <option value="">카테고리 선택</option>
                            <option value="management-system">경영시스템인증</option>
                            <option value="cyber-security">사이버보안</option>
                            <option value="product-certification">제품인증</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>작성 일자</label>
                        <input type="date" id="post-date" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>원문 링크 URL</label>
                    <input type="url" id="post-link" placeholder="기관 원문 페이지의 HTTPS 주소">
                </div>
                <div class="form-group">
                    <label>요약 내용</label>
                    <textarea id="post-desc" required placeholder="리포트의 핵심 내용을 2~3줄로 요약해 주세요."></textarea>
                </div>
                <div class="form-group">
                    <label>한국어 리포트 본문</label>
                    <div id="editor-container" style="height: 350px; background: white;"></div>
                </div>
                <div style="border-top: 1px solid #ddd; margin-top: 30px; padding-top: 20px;">
                    <h4 style="margin-bottom: 15px; color: var(--color-deep-navy);">영문 버전 (선택사항)</h4>
                    <div class="form-group">
                        <label>영문 리포트 제목</label>
                        <input type="text" id="post-title-en" placeholder="Enter english title">
                    </div>
                    <div class="form-group">
                        <label>영문 요약 내용</label>
                        <textarea id="post-desc-en" placeholder="Enter english summary"></textarea>
                    </div>
                    <div class="form-group">
                        <label>영문 리포트 본문</label>
                        <div id="editor-container-en" style="height: 350px; background: white;"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label><input type="checkbox" id="source-reviewed"> 원문 페이지의 제목·본문·발행일과 한국어 번역을 확인했습니다. 게시를 승인합니다.</label>
                    <p style="font-size:0.85rem;">출처를 확인하지 않은 신규·수정 리포트는 초안으로 저장됩니다.</p>
                </div>
                <button type="submit" class="btn-submit">새 리포트 등록하기</button>
            </form>

            <div class="admin-list">
                <h3 style="margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; color: var(--color-deep-navy);">등록된 리포트 관리</h3>
                <div id="post-list-container">
                    <!-- 자바스크립트로 로컬 스토리지 목록 렌더링 -->
                </div>
            </div>
        </div>
    </div>

    <script defer src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
    <script defer src="js/firebase-init.js?v=1.5"></script>
    <script defer src="js/admin-auth.js?v=2.0"></script>
    <script defer src="js/insight-data.js?v=2.0"></script>
    <script defer src="js/admin-editor.js?v=2.0"></script>
</body>
</html>
